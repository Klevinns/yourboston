[project]
name = "fitmap-pipeline"
version = "0.1.0"
description = "FitMap data pipeline — offline precompute"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2.0",
    "geopandas>=0.14.0",
    "shapely>=2.0.0",
    "pyproj>=3.6.0",
    "requests>=2.31.0",
    "pyarrow>=14.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "hypothesis>=6.100.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fitmap_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
